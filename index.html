<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Soldados Socorristas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar (desktop) ou barra inferior (celular) + conteúdo em cartões arredondados */
:root{
 --bg:#EEF3F9;--bg2:#E3EBF5;--card:#FFFFFF;--ink:#0B1E3F;--mut:#5B6B86;--line:#D5DFEC;
 --navy:#0B1E3F;--navy2:#14346B;--blue:#2B6CE4;--teal:#19B5A5;--teal-s:#D6F4F0;--green:#2FB66A;--green-s:#D9F5E4;
 --orange:#FF8A3D;--orange-s:#FFE9D9;--yellow:#FFC93C;--yellow-s:#FFF3CC;--purple:#7C5CFF;--purple-s:#E8E2FF;--red:#E5484D;--red-s:#FDE3E4;
 --on-navy:#FFFFFF;--shadow:0 6px 20px rgba(11,30,63,.08);--r:18px;
 --f-d:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--f-b:'Outfit','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07122A;--bg2:#0C1B3A;--card:#10264C;--ink:#EAF1FF;--mut:#9DB0D3;--line:#22407A;--teal-s:#0F3F4A;--green-s:#0E3B2C;--orange-s:#4A2B17;--yellow-s:#4A3C12;--purple-s:#2D2468;--red-s:#4A1C25;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07122A;--bg2:#0C1B3A;--card:#10264C;--ink:#EAF1FF;--mut:#9DB0D3;--line:#22407A;--teal-s:#0F3F4A;--green-s:#0E3B2C;--orange-s:#4A2B17;--yellow-s:#4A3C12;--purple-s:#2D2468;--red-s:#4A1C25;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-d);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem}h2{font-size:1.3rem}h3{font-size:1.08rem}h4{font-size:.95rem}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:8px}
.ic{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.app{min-height:100vh;display:grid;grid-template-columns:1fr}
.side{display:none}
.main{min-width:0;padding:16px max(16px,env(safe-area-inset-left,0px)) 96px max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:800;font-size:1.05rem}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--blue));display:grid;place-items:center;color:#fff}
.brand small{display:block;font-family:var(--f-b);font-weight:500;font-size:.7rem;color:var(--mut);letter-spacing:.04em}
.nav-b{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.nav-b button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--mut);padding:6px 2px;border-radius:12px}
.nav-b button.on{color:var(--blue);background:var(--bg2)}
.nav-b .ic{width:22px;height:22px}
.more{position:fixed;inset:0;z-index:40;background:rgba(7,18,42,.55);display:flex;align-items:flex-end}
.more .sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sheet .btn{justify-content:flex-start}
.atabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -4px 6px;scrollbar-width:thin}
.atabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.85rem;color:var(--mut);display:flex;gap:6px;align-items:center}
.atabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (min-width:900px){
 .app{grid-template-columns:250px 1fr}
 .side{display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;overflow:auto}
 .side .brand{color:#fff;margin:0 6px 14px}.side .brand small{color:#9DB0D3}
 .side button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#C8D6F2;padding:11px 12px;border-radius:14px;font-weight:600;text-align:left}
 .side button:hover{background:rgba(255,255,255,.08)}
 .side button.on{background:linear-gradient(90deg,var(--teal),#2aa6c9);color:var(--navy)}
 .side .sp{flex:1}
 .nav-b,.atabs.m{display:none}
 .main{padding:26px 32px 40px}
}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.mut{color:var(--mut)}.sm{font-size:.82rem}.xs{font-size:.74rem}.b{font-weight:700}.tc{text-align:center}
.grow{flex:1;min-width:0}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 70%,#1d4c9e 100%);color:#fff;border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero .av{width:92px;flex:none;background:rgba(255,255,255,.1);border-radius:50%;overflow:hidden}
.hero h1{font-size:1.45rem}.hero .mut{color:#B8C9EC}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(var(--teal),transparent 70%);opacity:.35;pointer-events:none}
.bar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.p i{background:linear-gradient(90deg,var(--purple),#b08cff)}
.bar.o i{background:linear-gradient(90deg,var(--orange),var(--yellow))}
.hero .bar{background:rgba(255,255,255,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 16px;font-weight:700;background:var(--teal);color:var(--navy);transition:transform .12s,filter .12s;text-decoration:none;min-height:44px}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.btn.nav{background:var(--navy);color:#fff}
.btn.org{background:var(--orange);color:#2a1300}
.btn.pur{background:var(--purple);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--blue);padding:8px 10px;min-height:36px}
.btn.sm{padding:7px 11px;min-height:34px;font-size:.84rem;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:700;background:var(--bg2);color:var(--mut)}
.chip.t{background:var(--teal-s);color:var(--teal)}.chip.g{background:var(--green-s);color:var(--green)}.chip.o{background:var(--orange-s);color:var(--orange)}.chip.y{background:var(--yellow-s);color:#9a6a00}.chip.p{background:var(--purple-s);color:var(--purple)}.chip.r{background:var(--red-s);color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.y{color:var(--yellow)}}
:root[data-theme="dark"] .chip.y{color:var(--yellow)}
.stat{display:flex;gap:10px;align-items:center}
.stat .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.stat b{font-family:var(--f-d);font-size:1.35rem;display:block;line-height:1}
.ico.t{background:var(--teal-s);color:var(--teal)}.ico.o{background:var(--orange-s);color:var(--orange)}.ico.p{background:var(--purple-s);color:var(--purple)}.ico.g{background:var(--green-s);color:var(--green)}.ico.y{background:var(--yellow-s);color:#c58a00}.ico.b{background:var(--bg2);color:var(--blue)}.ico.r{background:var(--red-s);color:var(--red)}
.mod{display:flex;flex-direction:column;gap:10px;position:relative;cursor:pointer;transition:transform .15s}
.mod:hover{transform:translateY(-2px)}
.mod .ico{width:46px;height:46px;border-radius:14px}
.mod.lk{opacity:.7}
.mod .num{position:absolute;right:14px;top:10px;font-family:var(--f-d);font-weight:800;font-size:1.8rem;color:var(--bg2)}
.callout{border-radius:14px;padding:12px 14px;display:flex;gap:10px;font-size:.92rem}
.callout.tip{background:var(--green-s)}.callout.warn{background:var(--orange-s)}.callout.info{background:var(--teal-s)}
.read{font-size:1rem;line-height:1.65}
.read p{max-width:68ch}
.read ul{padding-left:1.2em;margin:.4em 0 .8em}.read li{margin-bottom:.3em}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.steps button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:.76rem;font-weight:700;color:var(--mut)}
.steps button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps button.ok{border-color:var(--green);color:var(--green)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-weight:600;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--bg2)}
.opt.ok{border-color:var(--green);background:var(--green-s);animation:pop .35s}
.opt.no{border-color:var(--red);background:var(--red-s);animation:shake .35s}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-size:.8rem;flex:none}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:14px;padding:12px 14px}
.fb.ok{background:var(--green-s)}.fb.no{background:var(--red-s)}.fb.nt{background:var(--yellow-s)}
input[type=text],input[type=password],input[type=number],input[type=date],textarea,select{width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.84rem}
label.f span.h{font-weight:500;color:var(--mut);font-size:.76rem}
input[type=range]{width:100%}
.tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.88rem}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--bg2);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
tr:last-child td{border-bottom:0}
.scene{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#cfe4f7;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.hs{cursor:pointer}
.hs .ring{fill:rgba(255,201,60,.18);stroke:#FFC93C;stroke-width:1.2;stroke-dasharray:3 2;animation:pulse 1.6s infinite}
.hs.seen .ring{stroke:#2FB66A;fill:rgba(47,182,106,.18);animation:none}
.hs.ok .ring{stroke:#2FB66A;fill:rgba(47,182,106,.35);animation:none}.hs.no .ring{stroke:#E5484D;fill:rgba(229,72,77,.35);animation:none}
@keyframes pulse{50%{opacity:.35}}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pod{border-radius:18px 18px 0 0;padding:12px 6px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff}
.pod .av{width:64px;border-radius:50%;background:rgba(255,255,255,.18);overflow:hidden}
.pod.p1{background:linear-gradient(180deg,#F5A623,#d98b0f);min-height:190px}.pod.p2{background:linear-gradient(180deg,#7C8DB0,#566587);min-height:150px}.pod.p3{background:linear-gradient(180deg,#C27C4A,#9b5c2f);min-height:130px}
.pod b{font-family:var(--f-d);font-size:2rem;line-height:1}
.pod span.n{word-break:break-word;font-weight:700;font-size:.9rem}
.rk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px}
.rk.me{background:var(--purple-s);outline:2px solid var(--purple)}
.rk .pos{width:28px;text-align:center;font-family:var(--f-d);font-weight:800;color:var(--mut)}
.rk .av{width:40px;border-radius:50%;background:var(--bg2);overflow:hidden;flex:none}
.ach{display:flex;gap:12px;align-items:center}
.ach .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--purple),#a98bff);color:#fff;box-shadow:0 4px 12px rgba(124,92,255,.4)}
.ach.lk .medal{background:var(--bg2);color:var(--mut);box-shadow:none}
.ach.lk{opacity:.8}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;background:var(--navy);color:#fff;padding:12px 14px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;animation:drop .4s cubic-bezier(.2,1.2,.3,1)}
.toast.ach{background:linear-gradient(135deg,var(--purple),#5a3de0)}
.toast.err{background:var(--red)}.toast.ok{background:var(--green);color:#052b14}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(7,18,42,.6);z-index:60;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border-radius:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.devbar{position:sticky;top:0;z-index:50;background:var(--yellow);color:#2a1f00;padding:6px 12px;font-size:.78rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.devbar button{border:1px solid #2a1f00;background:transparent;border-radius:8px;padding:3px 8px;font-weight:700;color:inherit}
.devbar button.on{background:#2a1f00;color:var(--yellow)}
.notice{background:var(--yellow-s);border-radius:14px;padding:10px 14px;font-size:.86rem;display:flex;gap:10px;align-items:flex-start}
.notice.r{background:var(--red-s)}.notice.t{background:var(--teal-s)}
.fc{perspective:900px;height:210px;cursor:pointer}
.fc>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.fl>div{transform:rotateY(180deg)}
.fc .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:20px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:1.1rem}
.fc .f1{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.fc .f2{background:linear-gradient(135deg,var(--teal),var(--green));color:var(--navy);transform:rotateY(180deg)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .opt{padding:10px;font-size:.88rem}
.mt .opt.done{opacity:.4;pointer-events:none;border-color:var(--green)}
.timer{font-family:var(--f-d);font-weight:800;font-size:1.3rem;color:var(--orange)}
.avp{width:min(220px,60vw);margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--teal-s),var(--purple-s));overflow:hidden}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:6px 10px;font-size:.8rem;font-weight:700;min-height:36px;display:flex;align-items:center;gap:6px}
.sw button.on{border-color:var(--blue);background:var(--bg2)}
.sw button.lk{opacity:.5}
.sw .dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.15)}
.hr{height:1px;background:var(--line);margin:4px 0}
.empty{text-align:center;padding:28px 12px;color:var(--mut)}
.empty .ic{width:42px;height:42px;opacity:.6}
.spin{width:36px;height:36px;border:4px solid var(--bg2);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ob{max-width:460px;margin:0 auto;padding:20px 0}
.cover{border-radius:20px;overflow:hidden;line-height:0}.cover svg{width:100%;height:auto}
details>summary{cursor:pointer;font-weight:700}
.q-ill{margin-bottom:8px}
.seqi{display:flex;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.seqi span.t{flex:1;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.hero{flex-direction:column;text-align:center}.hero .row{justify-content:center}h1{font-size:1.45rem}}
.btn-card{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
/* ===== identidade artística ===== */
.avsvg{display:block;width:100%;height:auto}
.mod{overflow:hidden}.mthumb{margin:-16px -16px 2px;line-height:0}.mthumb .cover{border-radius:0}.mthumb svg{width:100%;height:auto}
.mod .num{z-index:2;background:var(--navy);color:#fff;border-radius:10px;padding:2px 9px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.cover{box-shadow:0 6px 18px rgba(11,30,63,.18)}
.gcard .gart{width:100%;height:auto;display:block;border-radius:12px}
.hero .av{position:relative;overflow:visible;background:none}
.hero .av .avsvg{border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.55)}
.lvbadge{position:absolute;right:-8px;bottom:-4px;width:34px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));animation:lvp 3s ease-in-out infinite}
.lvbadge svg{width:100%;display:block}
.hdeco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hdeco i{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);animation:float 7s ease-in-out infinite}
.hdeco i:nth-child(1){width:70px;height:70px;right:8%;top:-20px}
.hdeco i:nth-child(2){width:26px;height:26px;right:22%;bottom:12px;background:rgba(255,201,60,.4);animation-delay:-2s}
.hdeco i:nth-child(3){width:16px;height:16px;left:46%;top:14px;background:rgba(25,181,165,.55);animation-delay:-4s}
.hero>*:not(.hdeco){position:relative;z-index:1}
.ach .medal{background:none!important;box-shadow:none!important;width:62px;height:72px;border-radius:0}
.medalsvg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 4px rgba(11,30,63,.25))}
.medalsvg.lk{filter:none;opacity:.85}
.medalsvg.shine .spk{transform-origin:52px 17px;animation:twk 2.4s ease-in-out infinite}
.toast.ach{position:relative;overflow:visible;display:flex;gap:10px;align-items:center}
.toast .tm{width:44px;flex:none;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.confetti{position:absolute;left:30px;top:30px;pointer-events:none}
.confetti i{position:absolute;width:7px;height:10px;border-radius:2px;animation:cf 1.2s ease-out forwards}
.mascot{width:44px;display:block}.mascot.big{width:96px;animation:bob 2.6s ease-in-out infinite}
.fbm{display:flex;gap:10px;align-items:flex-start}.fbav{flex:none;width:44px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.7);border:2px solid #1b2a4a;animation:pop .4s}

var mod1 = {
 id:"m1", n:1, title:"Introdução aos primeiros socorros", icon:"heart",
 intro:"Em uma emergência, os primeiros minutos fazem diferença. Quem está por perto, muitas vezes um adolescente como você, pode ser a primeira pessoa a ajudar. Aqui você aprende o que fazer, e também o que não fazer.",
 objectives:["Definir o que são primeiros socorros e para que servem","Explicar por que a ajuda imediata é importante","Reconhecer a responsabilidade e os limites de quem presta auxílio","Compreender o que é omissão de socorro","Saber como acionar o SAMU (192) e os Bombeiros (193)"],
 sections:[
  {id:"m1s1", title:"O que são primeiros socorros", body:[
   "Primeiros socorros são os cuidados imediatos e simples dados a uma pessoa que sofreu um acidente ou passou mal, até a chegada de atendimento profissional. Eles não substituem o médico nem o SAMU. Servem para proteger a vida da vítima e evitar que a situação piore enquanto a ajuda chega.",
   "Quem presta esse primeiro auxílio é chamado de socorrista leigo: uma pessoa comum, sem formação em saúde, que aprendeu o básico. Você não precisa de equipamentos especiais. Muitas vezes, o mais importante é manter a calma, observar a situação e chamar ajuda qualificada rapidamente."
  ], callout:{type:"info", text:"Primeiros socorros não são tratamento. São os cuidados que mantêm a pessoa segura até o atendimento profissional assumir."}},
  {id:"m1s2", title:"Por que a ajuda imediata importa", body:[
   "Em algumas emergências, cada minuto conta. Quando o coração para ou a pessoa não consegue respirar, o cérebro sofre rapidamente sem oxigênio. Quanto antes alguém começa a ajudar e chama o socorro, maiores são as chances de a vítima chegar viva e com menos sequelas ao hospital.",
   "Imagine um colega que desmaia na quadra da escola. Se todos ficam parados, a ajuda demora. Se alguém liga para o 192, outro afasta a multidão e um terceiro observa a respiração, a equipe de socorro chega com informações claras. Pequenas ações organizadas salvam vidas."
  ], bullets:["Proteger a vida da vítima","Evitar que o quadro piore","Aliviar o sofrimento e acalmar","Garantir que o socorro profissional seja acionado"]},
  {id:"m1s3", title:"Responsabilidade e limites do socorrista leigo", body:[
   "Ajudar exige responsabilidade. Antes de qualquer coisa, pense na sua segurança: se você se machucar, vira mais uma vítima e não consegue ajudar ninguém. Só se aproxime quando a cena estiver segura. Se houver fogo, trânsito, fios soltos ou violência, afaste-se e chame 192, 193 ou 190.",
   "Conheça seus limites. O socorrista leigo não dá remédios, não faz diagnóstico e não realiza procedimentos invasivos. Ele faz o que aprendeu: cuidados simples e seguros, como chamar ajuda, controlar um sangramento com pressão ou iniciar compressões no peito. O resto é trabalho dos profissionais.",
   "Respeite também a pessoa ajudada. Fale com calma, explique o que está fazendo, proteja a privacidade dela e evite expor a vítima em fotos ou vídeos. Se você é menor de idade, avise sempre um adulto responsável o mais rápido possível, sem deixar de ligar para o socorro."
  ], callout:{type:"warn", text:"Nunca se coloque em perigo para ajudar. Sua segurança vem primeiro."}},
  {id:"m1s4", title:"Omissão de socorro", body:[
   "O Código Penal brasileiro (art. 135) trata como crime deixar de prestar assistência a quem está em perigo, quando é possível ajudar sem risco pessoal. Mas atenção: ajudar não significa fazer tudo sozinho. Muitas vezes, a assistência exigida é simplesmente pedir socorro à autoridade pública, ou seja, ligar para o 192 ou 193.",
   "Por isso, o mínimo que qualquer pessoa pode fazer é chamar ajuda. Ninguém espera que você aja como médico ou que se arrisque. O que se espera é que você não ignore quem precisa. Ligar, informar o local e ficar por perto, se for seguro, já é uma atitude de cuidado e de cidadania."
  ]},
  {id:"m1s5", title:"Como acionar o 192 e o 193", body:[
   "O SAMU atende pelo número 192 e envia equipes de saúde para emergências clínicas e traumas. Os Bombeiros atendem pelo 193 e atuam em resgates, incêndios, afogamentos e acidentes. A Polícia é o 190 e a Defesa Civil, o 199. A ligação é gratuita e pode ser feita de celular ou de telefone fixo.",
   "Ao ligar, mantenha a calma e responda ao que o atendente perguntar. Diga o endereço com ponto de referência, o que aconteceu, quantas pessoas estão feridas e o estado delas. Não desligue antes que o atendente autorize: ele pode orientar o que fazer até a equipe chegar."
  ], callout:{type:"tip", text:"Decore: SAMU 192, Bombeiros 193, Polícia 190, Defesa Civil 199."}}
 ],
 examples:[
  {title:"Colega passa mal no recreio", env:"escola", text:"Durante o recreio, um colega fica pálido e cai no pátio. Você percebe que ele não responde. Em vez de entrar em pânico, você pede a um colega que chame um professor, outro liga para o 192, e você observa se ele respira, sem mexer nele. Assim, o socorro é acionado rápido e você não faz nada além do seguro."},
  {title:"Acidente de bicicleta", env:"rua", text:"Você vê um ciclista cair perto do semáforo. Antes de correr até ele, olha se há carros vindo. Só se aproxima quando o trânsito está parado, pergunta se ele está bem e liga para o 192 informando a rua e um ponto de referência. Ajudar com segurança evita que você se torne outra vítima."}
 ],
 summary:["Primeiros socorros são cuidados imediatos e simples até a chegada do socorro profissional","Sua segurança vem sempre em primeiro lugar","O socorrista leigo não dá remédios nem faz procedimentos invasivos","Omissão de socorro é crime (art. 135), mas o mínimo é pedir ajuda","SAMU 192, Bombeiros 193, Polícia 190, Defesa Civil 199","Ao ligar: local, o que houve, quantas vítimas e o estado delas"],
 extras:[
  {title:"Mito x Verdade", text:"Mito: só quem fez curso pode ajudar. Verdade: qualquer pessoa pode e deve pedir ajuda ao 192. O curso apenas amplia o que você consegue fazer com segurança."},
  {title:"Checklist rápido", text:"1) A cena está segura? 2) Chame 192/193. 3) Observe consciência e respiração. 4) Faça só o que sabe. 5) Fique até o socorro chegar, se for seguro."},
  {title:"Para saber mais", text:"A melhor forma de aprender primeiros socorros é praticar com um instrutor presencial, em manequins. Siga sempre o protocolo ensinado por ele."}

 cards:[

  {q:"Número do SAMU", a:"192, para emergências de saúde. Os Bombeiros atendem pelo 193."},
  {q:"O que é omissão de socorro?", a:"Crime de deixar de ajudar quem está em perigo, podendo fazê-lo sem risco; pedir socorro já é ajudar."},
  {q:"O que o socorrista leigo NÃO faz?", a:"Não dá remédios, não faz diagnóstico nem procedimentos invasivos."}
 ],
 activity:[
  {id:"m1a1", type:"mc", q:"Qual é o principal objetivo dos primeiros socorros?", options:["Tratar a doença da vítima","Manter a pessoa segura e evitar que piore até o socorro chegar","Substituir o atendimento médico","Dar remédios para aliviar a dor"], answer:1, exp:"Primeiros socorros são cuidados imediatos e simples; o tratamento é feito pelos profissionais."},
  {id:"m1a2", type:"tf", q:"Você deve entrar em uma cena perigosa para ajudar, mesmo que corra risco, porque a vítima vem primeiro.", answer:false, exp:"A sua segurança vem primeiro. Se você se machucar, vira outra vítima e ninguém ajuda."},
  {id:"m1a3", type:"short", q:"Qual é o número de telefone do SAMU?", answers:["192"], exp:"O SAMU atende pelo 192. Os Bombeiros atendem pelo 193."},
  {id:"m1a4", type:"match", q:"Ligue cada serviço ao seu número.", pairs:[["SAMU","192"],["Bombeiros","193"],["Polícia","190"],["Defesa Civil","199"]], exp:"Memorizar esses números ajuda você a agir sem perder tempo."},
  {id:"m1a5", type:"seq", q:"Coloque na ordem a conduta inicial diante de uma emergência.", items:["Verificar se a cena está segura","Chamar o 192 ou 193","Observar consciência e respiração","Fazer só os cuidados que você sabe","Aguardar o socorro, se for seguro"], exp:"Segurança primeiro, depois ajuda, avaliação e cuidados simples."},
  {id:"m1a6", type:"essay", q:"Explique com suas palavras por que o socorrista leigo tem limites e dê um exemplo de algo que ele não deve fazer.", exp:"Esperado: o leigo não tem formação para diagnosticar ou tratar; agir além do que sabe pode piorar a situação. Exemplos: dar remédio, mexer em suspeita de coluna sem necessidade, retirar objeto cravado."}
 ],
 assessment:[
  {id:"m1s1", type:"mc", q:"Quem é considerado socorrista leigo?", options:["Somente médicos e enfermeiros","Pessoa comum que aprendeu o básico de primeiros socorros","Apenas bombeiros","Somente professores"], answer:1, exp:"O socorrista leigo é qualquer pessoa sem formação em saúde que aprendeu cuidados básicos."},
  {id:"m1s2", type:"mc", q:"Ao ligar para o 192, o que você deve fazer?", options:["Desligar logo após dar o nome","Dar o local, o que aconteceu e responder às perguntas do atendente","Falar apenas o que sente","Esperar a vítima acordar antes de ligar"], answer:1, exp:"Informações claras permitem enviar a equipe certa e o atendente pode orientar você."},
  {id:"m1s3", type:"mc", q:"Qual atitude representa o mínimo esperado diante de alguém em perigo?", options:["Ignorar para não se envolver","Filmar a cena","Pedir socorro ao 192 ou 193","Dar um remédio que você tem em casa"], answer:2, exp:"Pedir socorro à autoridade pública já é uma forma de assistência e evita a omissão."},
  {id:"m1s4", type:"tf", q:"Segundo o Código Penal (art. 135), deixar de prestar assistência, podendo fazê-lo sem risco pessoal, é omissão de socorro.", answer:true, exp:"O crime se configura quando é possível ajudar sem risco, o que inclui ao menos pedir socorro."},
  {id:"m1s5", type:"err", q:"Encontre a afirmação INCORRETA.", items:["O 193 é o número dos Bombeiros","A ligação para o 192 é gratuita","O socorrista leigo deve dar remédios para dor","A segurança do socorrista vem em primeiro lugar"], answer:2, exp:"O leigo não administra medicação. Ele faz cuidados simples e chama ajuda."},
  {id:"m1s6", type:"short", q:"Que número você liga para acionar os Bombeiros?", answers:["193"], exp:"Os Bombeiros atendem pelo 193 em resgates, incêndios e acidentes."}
 ]
};

var mod2 = {
 id:"m2", n:2, title:"Avaliação e abordagem da vítima", icon:"eye",
 intro:"Antes de ajudar, olhe. Uma boa avaliação evita que você se machuque e mostra o que a vítima mais precisa. Em poucos segundos você descobre se ela responde, se respira e se o socorro precisa vir correndo.",
 objectives:["Avaliar a segurança da cena antes de se aproximar","Identificar riscos para você, a vítima e os outros","Realizar a abordagem inicial e checar consciência e respiração","Reconhecer sinais de alerta que exigem acionar o 192","Saber o que dizer ao ligar para o 192"],
 sections:[
  {id:"m2s1", title:"Segurança da cena", body:[
   "Antes de tocar em qualquer vítima, pare e observe. Pergunte-se: tem trânsito, fogo, fios elétricos, vidro quebrado, água, animais, multidão agitada ou risco de desabamento? A cena precisa estar segura para você, para a vítima e para quem está por perto. Esse olhar leva poucos segundos e evita tragédias.",
   "Se houver perigo que você não consegue eliminar, não entre. Mantenha distância, avise as pessoas, e chame 192, 193 ou 190. Um exemplo comum: uma pessoa caída perto de um fio solto na calçada. Tocar nela pode causar choque elétrico em você. Nesse caso, afaste os curiosos e ligue para a emergência."
  ], callout:{type:"warn", text:"Cena insegura? Não entre. Afaste-se e chame ajuda profissional."}},
  {id:"m2s2", title:"Abordagem inicial: a vítima responde?", body:[
   "Com a cena segura, aproxime-se e se apresente. Chame a pessoa em voz alta e pergunte: \"Você está me ouvindo? Está tudo bem?\". Toque de leve nos ombros. Se ela responde, abre os olhos ou se mexe, está consciente. Pergunte o que aconteceu, onde dói e tranquilize.",
   "Se não houver resposta, considere a pessoa inconsciente e peça ajuda imediatamente: grite por alguém e mande ligar para o 192. Não sacuda a vítima com força, pois pode haver lesão na coluna. Se houver risco de trauma, mexa o mínimo possível e evite movimentar pescoço e cabeça."
  ]},
  {id:"m2s3", title:"Respira normalmente?", body:[
   "Em vítima que não responde, verifique a respiração por até 10 segundos, olhando o peito subir e descer, sem fazer movimentos bruscos. Observe se o ar entra e sai de forma regular. Respiração normal é regular e tranquila. A pessoa que apenas \"suspira\" de forma lenta e ruidosa não está respirando normalmente.",
   "Se a pessoa não responde e não respira, ou respira de forma anormal, é parada cardiorrespiratória: peça o 192 e um DEA, se houver, e comece compressões no centro do peito. Se respira normalmente e não responde, mantenha-a em observação e aguarde o socorro. Siga o protocolo ensinado pelo instrutor presencial."
  ], callout:{type:"info", text:"Sem resposta e sem respiração normal: 192 e compressões no centro do peito."}},
  {id:"m2s4", title:"Sinais de alerta", body:[
   "Alguns sinais indicam gravidade e pedem acionamento imediato do 192: inconsciência, dificuldade para respirar, dor forte no peito, sangramento intenso, confusão mental repentina, convulsão, queimadura extensa, fratura exposta e trauma de cabeça ou de coluna. Mesmo se a pessoa parecer estar bem, na dúvida, ligue.",
   "Observe também a pele e a aparência: palidez, suor frio, lábios arroxeados e sonolência são sinais de que algo não vai bem. Em acidentes, não se deixe enganar pela ausência de dor: a vítima pode estar em choque ou com lesões internas. Ligar cedo é sempre melhor do que ligar tarde."
  ]},
  {id:"m2s5", title:"O que dizer ao ligar para o 192", body:[
   "Ao ligar, o atendente é um profissional de saúde e fará perguntas. Responda com calma. Informe: o endereço completo com ponto de referência; o que aconteceu; quantas pessoas estão feridas; se a vítima está consciente e respirando; e seu nome e telefone. Fale devagar e com clareza.",
   "Não desligue antes de o atendente liberar. Ele pode dar orientações por telefone, como iniciar compressões. Se possível, mande alguém esperar a equipe na entrada, para guiá-la até você. Se estiver sozinho, ligue no viva-voz e continue ajudando enquanto conversa. Retome o contato se algo mudar."
  ], bullets:["Onde: endereço e ponto de referência","O quê: o que aconteceu","Quem: quantas vítimas e o estado delas","Você: nome e telefone para retorno"]}
 ],
 examples:[
  {title:"Colega caído na quadra", env:"quadra", text:"Durante um jogo, um colega cai e não se mexe. Você para, olha ao redor: a bola e os jogadores estão afastados, a cena é segura. Chama o nome dele, toca os ombros, sem resposta. Pede que alguém ligue para o 192 e observa se o peito sobe e desce, por até 10 segundos."},
  {title:"Pessoa caída em frente à igreja", env:"comunidade", text:"Na saída do culto, uma senhora cai na calçada. Você pergunta se ela está bem. Ela responde, mas está confusa e com fala enrolada. Você não a levanta, chama um adulto e liga para o 192, informando o endereço, que ela está consciente, mas confusa, e que a fala está alterada."}
 ],
 summary:["Primeiro, avalie a segurança da cena","Cena insegura: não entre e chame 192, 193 ou 190","Chame a vítima e toque nos ombros para ver se ela responde","Sem resposta: peça ajuda e verifique a respiração por até 10 segundos","Sem respiração normal: 192 e compressões no centro do peito","Ao ligar, dê local, o que houve, quantas vítimas e o estado delas"],
 extras:[
  {title:"Mito x Verdade", text:"Mito: sacudir a pessoa ajuda a acordá-la. Verdade: sacudir com força pode agravar lesão de coluna. Chame em voz alta e toque nos ombros com cuidado."},
  {title:"Checklist: Cena, Resposta, Respiração", text:"Cena segura? A vítima responde? Ela respira normalmente? Três perguntas simples guiam seus primeiros 30 segundos."},
  {title:"Curiosidade", text:"O atendente do 192 pode orientar você por telefone durante a ligação, inclusive a fazer compressões no peito. Por isso, não desligue antes de ele liberar."}
 ],
 cards:[

 ],
 activity:[

  {id:"m2a2", type:"tf", q:"Para saber se a vítima está consciente, o ideal é sacudi-la com força.", answer:false, exp:"Chame em voz alta e toque nos ombros com cuidado. Sacudir pode agravar lesão na coluna."},
  {id:"m2a3", type:"short", q:"Por até quantos segundos você deve checar a respiração da vítima?", answers:["10","dez"], exp:"A checagem leva até 10 segundos, olhando o peito subir e descer."},
  {id:"m2a4", type:"match", q:"Relacione a informação ao que dizer ao 192.", pairs:[["Onde","Endereço com ponto de referência"],["O quê","O que aconteceu"],["Quem","Quantas vítimas e como estão"],["Contato","Seu nome e telefone"]], exp:"Informações claras ajudam a enviar o recurso certo mais rápido."},
  {id:"m2a5", type:"seq", q:"Coloque na ordem a abordagem inicial.", items:["Avaliar a segurança da cena","Chamar a vítima e tocar os ombros","Pedir ajuda e ligar para o 192, se não responder","Checar a respiração por até 10 segundos","Seguir as orientações do atendente"], exp:"A sequência prioriza segurança, resposta, ajuda e respiração."},

 ],
 assessment:[
  {id:"m2s1", type:"mc", q:"O que fazer primeiro ao encontrar uma pessoa caída?", options:["Levantá-la imediatamente","Dar água","Verificar se a cena está segura","Sacudi-la para acordar"], answer:2, exp:"Sem cena segura, o socorrista pode se ferir e não conseguir ajudar."},
  {id:"m2s2", type:"mc", q:"Uma vítima não responde e não respira normalmente. Qual a conduta?", options:["Aguardar alguns minutos","Dar um copo d'água","Ligar 192, pedir um DEA e iniciar compressões no centro do peito","Colocar a pessoa sentada"], answer:2, exp:"Sem resposta e sem respiração normal, trata-se de emergência máxima: 192, DEA e compressões."},
  {id:"m2s3", type:"mc", q:"Qual destas informações NÃO é prioridade ao ligar para o 192?", options:["Endereço com ponto de referência","O que aconteceu","A cor do carro de quem passou","Quantas pessoas estão feridas"], answer:2, exp:"O atendente precisa saber local, ocorrência, número de vítimas e estado delas."},

var mod3 = {
 id:"m3", n:3, title:"Emergências clínicas", icon:"pulse",
 intro:"Nem toda emergência vem de acidente. Um colega pode convulsionar na aula, desmaiar na fila ou passar mal no culto. Saber reconhecer o que está acontecendo e agir com calma protege a pessoa até o socorro chegar.",
 objectives:["Reconhecer uma convulsão e aplicar condutas seguras","Reconhecer um desmaio e saber o que fazer","Identificar sinais de alerta de AVC e infarto","Reconhecer sinais de hipoglicemia leve","Saber quando acionar o 192 em emergências clínicas"],
 sections:[
  {id:"m3s1", title:"Convulsões: reconhecer", body:[
   "A convulsão acontece por uma descarga elétrica desordenada no cérebro. A pessoa pode ficar rígida, cair, ter movimentos bruscos e repetitivos, perder a consciência, babar e, às vezes, perder o controle da urina. Pode ter causas diferentes, como epilepsia, febre alta em crianças, pancada na cabeça ou outras doenças.",
   "A maioria das convulsões passa sozinha em poucos minutos. É assustador de assistir, mas você não precisa tentar parar a crise. Seu papel é proteger a pessoa de se machucar, cronometrar o tempo e chamar ajuda quando necessário. Depois, ela costuma ficar sonolenta e confusa, o que é esperado."
  ]},
  {id:"m3s2", title:"Convulsões: o que fazer", body:[
   "Durante a crise, afaste objetos que possam machucar, como cadeiras e mesas, e apoie a cabeça com algo macio, como uma mochila ou casaco dobrado. Afrouxe roupas apertadas no pescoço e marque o horário. Peça aos curiosos que se afastem para dar privacidade. Fique perto e fale com calma.",
   "Não segure a pessoa, não coloque nada na boca dela (nem colher, nem pano, nem dedo) e não dê água. Quando os movimentos pararem, vire a pessoa de lado para ajudar na respiração e na saída de saliva. Ligue para o 192 se durar mais de 5 minutos, for a primeira vez, houver lesão, dificuldade de respirar, gestante ou se a crise se repetir."
  ], callout:{type:"warn", text:"Nunca segure a pessoa e nunca coloque nada na boca durante a convulsão."}},
  {id:"m3s3", title:"Desmaios", body:[
   "O desmaio é uma perda de consciência breve, geralmente por queda temporária do fluxo de sangue no cérebro. Pode vir após ficar muito tempo em pé, calor, jejum, susto, dor ou sol forte. Antes de desmaiar, a pessoa costuma sentir tontura, suor frio, palidez, visão escurecida ou fraqueza. Ela costuma acordar em instantes.",
   "Se perceber que alguém vai desmaiar, ajude a deitar ou sentar. Se já desmaiou, deite a pessoa de barriga para cima, eleve as pernas, afrouxe a roupa e deixe o ambiente ventilado. Se ela não acordar em cerca de 1 minuto, ou não respirar normalmente, ligue para o 192 e comece compressões, se não responder e não respirar normalmente."
  ], bullets:["Deitar e elevar as pernas","Afrouxar a roupa e ventilar o ambiente","Não dar comida ou bebida até acordar totalmente","192 se não acordar em cerca de 1 minuto"]},
  {id:"m3s4", title:"AVC e infarto: sinais de alerta", body:[
   "O AVC acontece quando falta sangue em uma parte do cérebro. Sinais comuns: rosto torto ou boca caída de um lado, fraqueza ou formigamento em um braço ou perna, fala enrolada ou confusa e dor de cabeça súbita e muito forte. Quanto mais rápido o atendimento, melhor. Ligue para o 192 e anote o horário em que os sinais começaram.",
   "O infarto ocorre quando falta sangue para o coração. Sinais: dor ou pressão no peito, que pode irradiar para braço, ombro, costas ou mandíbula, falta de ar, suor frio, náusea e mal-estar. Em ambos, não espere melhorar, acione o 192, mantenha a pessoa em repouso e não dê remédio nem comida. Se parar de responder e respirar, inicie compressões."
  ], callout:{type:"warn", text:"Rosto torto, braço fraco, fala alterada ou dor no peito: ligue 192 imediatamente."}},
  {id:"m3s5", title:"Hipoglicemia leve: reconhecer", body:[
   "A hipoglicemia é a queda do açúcar no sangue, mais comum em pessoas com diabetes. Sinais: tremores, suor frio, fome súbita, tontura, irritação, palidez, dor de cabeça e confusão. Isso pode acontecer, por exemplo, em uma criança diabética que ficou muito tempo sem comer durante uma gincana.",
   "Seu papel é reconhecer e acionar ajuda: ligue para o 192, mantenha a pessoa sentada ou deitada, e siga as orientações do atendente. Se ela estiver confusa, sonolenta ou inconsciente, não dê nada pela boca, pois há risco de engasgo. Avise um adulto responsável e fique ao lado até a equipe chegar."
  ]}
 ],
 examples:[
  {title:"Convulsão na sala de aula", env:"escola", text:"Um colega cai no chão e começa a se debater. Você afasta carteiras, coloca a mochila sob a cabeça dele e pede que alguém marque o horário e chame o professor. Não o segura nem coloca nada na boca. Quando os movimentos param, você o vira de lado e liga para o 192, pois foi a primeira vez que isso aconteceu."},
  {title:"Desmaio no calor", env:"ar livre", text:"Durante uma caminhada em dia de sol forte, uma colega fica pálida, suada e cai desmaiada. Você a leva para a sombra, deita-a de barriga para cima, eleva as pernas e afrouxa a roupa. Ela acorda em menos de um minuto, mas você avisa um adulto e mantém a observação até ela se recuperar."}
 ],
 summary:["Na convulsão: proteger, apoiar a cabeça, não segurar e não colocar nada na boca","Cronometrar e ligar 192 se passar de 5 minutos, 1ª vez, lesão ou repetição","Depois da convulsão, virar a pessoa de lado","No desmaio: deitar, elevar pernas, ventilar; 192 se não acordar em cerca de 1 minuto","AVC e infarto: reconhecer os sinais e ligar 192 sem demora","Hipoglicemia: reconhecer, chamar ajuda e nada pela boca se estiver confusa"],
 extras:[
  {title:"Mito x Verdade", text:"Mito: a pessoa em convulsão pode engolir a língua. Verdade: isso não acontece. Colocar objetos na boca machuca e dificulta a respiração."},
  {title:"Sinais do AVC: lembrete", text:"Observe rosto (boca torta), braços (um cai ou fica fraco) e fala (enrolada). Se algum estiver alterado, ligue 192 e anote o horário."},
  {title:"Checklist da convulsão", text:"Afastar objetos, apoiar a cabeça, marcar o tempo, não segurar, nada na boca, virar de lado quando parar, 192 se houver sinais de gravidade."}
 ],

  {id:"m3a6", type:"essay", q:"Explique por que não se deve segurar nem colocar objetos na boca de quem convulsiona.", exp:"Esperado: segurar pode causar fraturas e lesões; objetos na boca machucam dentes e língua e obstruem a respiração; a língua não é engolida. Conduta: proteger, apoiar a cabeça, cronometrar."}

  {id:"m3s2", type:"mc", q:"Após o fim da convulsão, a pessoa está respirando e sonolenta. O que fazer?", options:["Dar água e comida","Sacudir para acordar","Virar de lado e observar","Deixá-la de barriga para cima sem vigiar"], answer:2, exp:"Posição de lado ajuda na respiração e evita engasgo. Observe e chame o 192 se houver critério."},

var mod4 = {
 id:"m4", n:4, title:"Obstrução das vias aéreas", icon:"wind",
 intro:"Um pedaço de comida, uma bala, um brinquedo: coisas pequenas podem bloquear a passagem do ar. O engasgo assusta, mas tem solução. Saber distinguir entre engasgo leve e grave define o que fazer.",
 objectives:["Definir obstrução das vias aéreas e suas causas","Reconhecer engasgo leve e engasgo grave","Aplicar a conduta correta para adulto, criança e lactente","Saber o que fazer se a vítima ficar inconsciente","Acionar o 192 na hora certa"],
 sections:[
  {id:"m4s1", title:"O que é obstrução e quais as causas", body:[
   "A obstrução das vias aéreas, ou engasgo, acontece quando algo bloqueia a passagem do ar pela garganta ou pela traqueia. Pode ser parcial, quando ainda passa um pouco de ar, ou total, quando o ar não passa. Sem ar, a pessoa pode perder a consciência em poucos minutos, por isso é preciso agir rápido.",
   "As causas mais comuns são alimentos mal mastigados, falar ou rir enquanto come, balas, pedaços de brinquedos, moedas, tampas de caneta e líquidos engolidos de forma errada. Em lactentes e crianças pequenas, qualquer objeto pequeno que vai à boca é risco. Vigie e evite alimentos duros ou redondos nessa faixa etária."
  ]},
  {id:"m4s2", title:"Engasgo leve (obstrução parcial)", body:[
   "No engasgo leve, a pessoa consegue tossir, falar ou respirar, mesmo com esforço. A tosse é forte e ela está alerta. Isso significa que passa ar. A tosse é o mecanismo mais eficiente do corpo para expulsar o objeto, então o melhor é deixar a pessoa tossir.",
   "Fique ao lado, incentive-a a continuar tossindo e observe com atenção. Não bata nas costas e não dê água, pois isso pode empurrar o objeto para dentro. Se a tosse perder a força, a pessoa não conseguir mais falar ou respirar, ou o objeto não sair, considere engasgo grave e acione o 192."
  ], callout:{type:"tip", text:"Engasgo leve: estimule a tosse. Não bata nas costas."}},
  {id:"m4s3", title:"Engasgo grave em adulto e criança", body:[
   "No engasgo grave, a pessoa não consegue falar, tossir ou respirar. Muitas vezes leva as mãos ao pescoço, fica com o rosto vermelho ou arroxeado e com expressão de pânico. É emergência. Peça para alguém ligar para o 192 imediatamente e comece a manobra, sem perder tempo.",
   "Em adulto e criança, alterne 5 tapas firmes nas costas, entre as escápulas, com 5 compressões abdominais (manobra de Heimlich): fique atrás, posicione o punho acima do umbigo, abaixo das costelas, e puxe com força para dentro e para cima. Repita até o objeto sair ou a vítima ficar inconsciente. Em gestantes e obesos, compressões no tórax."
  ], bullets:["5 tapas nas costas","5 compressões abdominais","Repetir alternando","Se ficar inconsciente: 192 e RCP"]},
  {id:"m4s4", title:"Engasgo grave em lactente", body:[
   "Lactente é o bebê com menos de 1 ano. No engasgo grave, ele não chora, não tosse e pode ficar arroxeado. Nunca faça a manobra de Heimlich em bebê. Segure-o de bruços sobre seu antebraço, apoiado na coxa, com a cabeça mais baixa que o corpo, apoiando o queixo com a mão.",
   "Dê 5 tapas firmes entre as escápulas. Depois, vire o bebê de barriga para cima, com a cabeça mais baixa, e faça 5 compressões no centro do peito com 2 dedos, cerca de 4 cm de profundidade. Alterne os ciclos até o objeto sair. Peça a alguém que ligue para o 192. Siga o protocolo ensinado pelo instrutor presencial."
  ]},
  {id:"m4s5", title:"Se a vítima ficar inconsciente", body:[
   "Se a vítima ficar inconsciente e não respirar normalmente, deite-a no chão em local firme, confirme que alguém ligou para o 192 e inicie a RCP com compressões no centro do peito. As compressões também podem ajudar a mover o objeto. Se você é leigo e não treinado, faça apenas compressões.",
   "Se for treinado, faça compressões e ventilações (30:2). Antes de cada ventilação, abra a boca e olhe: se enxergar claramente o objeto, retire-o. Nunca faça varredura às cegas com o dedo. Continue até a equipe do 192 chegar ou a vítima voltar a respirar e se movimentar."
  ], callout:{type:"warn", text:"Nunca enfie o dedo às cegas na garganta: pode empurrar o objeto."}}
 ],
 examples:[
  {title:"Engasgo na cantina", env:"escola", text:"Durante o lanche, um colega leva as mãos ao pescoço e não consegue falar nem tossir. Você pede que alguém ligue para o 192, se posiciona atrás dele, dá 5 tapas nas costas e 5 compressões abdominais, alternando. Depois de algumas séries, o pedaço de pão sai e ele volta a respirar. Mesmo assim, ele deve ser avaliado."},
  {title:"Bebê engasgado na casa de parentes", env:"casa", text:"Seu priminho de 8 meses põe uma tampinha na boca e fica sem chorar e arroxeado. Você pede ajuda ao 192 e, com um adulto, o apoia de bruços no antebraço, cabeça baixa, e dá 5 tapas nas costas. Depois o vira e faz 5 compressões no peito com 2 dedos, alternando até a tampinha sair."}

var mod5 = {
 id:"m5", n:5, title:"Emergências traumáticas", icon:"alert",
 intro:"Quedas na quadra, tombos de bicicleta, batidas de cabeça, torções no futebol. Os traumas são comuns na vida dos adolescentes. Saber o que fazer, e principalmente o que evitar, impede que uma lesão se torne mais grave.",
 objectives:["Definir trauma e reconhecer as situações mais comuns","Identificar sinais de gravidade","Aplicar cuidados iniciais e prevenir agravamentos","Agir diante de TCE e suspeita de lesão na coluna","Cuidar de entorses, luxações e ferimentos com segurança"],
 sections:[
  {id:"m5s1", title:"O que é trauma e onde acontece", body:[
   "Trauma é uma lesão causada por uma força externa ao corpo, como pancada, queda, batida, queimadura ou corte. Pode atingir pele, músculos, ossos, articulações e órgãos internos. Algumas lesões são visíveis, outras ficam escondidas, como uma lesão interna ou uma pancada na cabeça que parecia leve.",
   "As situações mais comuns são quedas (de escada, bicicleta, skate ou árvore), acidentes de trânsito, pancadas durante esportes, brincadeiras, cortes e acidentes domésticos. O que importa é perceber que o mecanismo do acidente indica a gravidade: queda de grande altura ou batida forte merecem atenção maior, mesmo se a vítima disser que está bem."
  ]},
  {id:"m5s2", title:"Sinais de gravidade e cuidados iniciais", body:[
   "Considere grave quando houver: perda de consciência, confusão, dificuldade para respirar, sangramento intenso, dor forte, deformidade em ossos, vômitos repetidos, convulsão, paralisia ou formigamento, ou queda de grande altura. Em qualquer um desses casos, ligue para o 192. Na dúvida, ligue.",
   "Os cuidados iniciais seguem a lógica: segurança da cena, chamar ajuda, avaliar consciência e respiração, controlar sangramento visível com pressão direta e manter a pessoa calma e aquecida. Não dê comida nem bebida, pois a vítima pode precisar de cirurgia. Observe a pessoa até o socorro chegar e informe o que viu."
  ]},
  {id:"m5s3", title:"Prevenir agravamentos", body:[
   "A regra é: não mover sem necessidade. Mexer em uma vítima com lesão na coluna pode causar dano permanente. Só mova em perigo iminente, como fogo, desabamento, risco de atropelamento ou gás. Nesse caso, arraste a vítima pelo eixo longo do corpo, mantendo cabeça, pescoço e tronco alinhados.",
   "Em acidentes de moto, o leigo não deve retirar o capacete, salvo se for necessário para a via aérea ou para a RCP, e, se possível, apenas por quem foi treinado. Também evite levantar a vítima \"para ver se consegue andar\", dar comida ou bebida e retirar objetos cravados. Cada movimento desnecessário pode agravar o quadro."
  ], callout:{type:"warn", text:"Na dúvida sobre coluna, não mova. Aguarde o socorro."}},
  {id:"m5s4", title:"Trauma de cabeça (TCE) e suspeita de lesão na coluna", body:[
   "O traumatismo cranioencefálico (TCE) é uma pancada na cabeça. Mesmo parecendo leve, pode ter consequências. Sinais de gravidade: perda de consciência, vômitos, sonolência, confusão, dor de cabeça forte, convulsão, saída de líquido ou sangue pelo ouvido ou nariz, e diferença no tamanho das pupilas. Nesses casos, ligue 192 e não dê alimento ou bebida.",
   "Suspeite de lesão na coluna em quedas de altura, acidentes de trânsito, mergulhos e batidas fortes na cabeça ou pescoço, ou se houver dor no pescoço ou nas costas, formigamento ou perda de força. Peça à vítima que fique imóvel, apoie a cabeça sem tracionar, ligue 192 e aguarde. Não flexione nem gire o pescoço."
  ], bullets:["Vômitos, sonolência ou confusão após pancada","Convulsão","Líquido ou sangue saindo pelo ouvido ou nariz","Dor no pescoço, formigamento ou perda de força"]},
  {id:"m5s5", title:"Entorses, luxações, fraturas e ferimentos", body:[
   "A entorse é uma torção de articulação (como o tornozelo); a luxação é quando o osso sai do lugar na articulação; a fratura é a quebra do osso. Sinais comuns: dor, inchaço, deformidade e dificuldade de movimentar. Imobilize na posição encontrada, sem tentar alinhar nem empurrar o osso, e aplique frio com pano entre o gelo e a pele. Se for grave, ligue 192.",
   "Em ferimentos, lave as mãos ou use luvas, controle o sangramento com pressão direta e use pano limpo. Em fratura exposta, cubra com pano limpo, sem empurrar o osso de volta. Não remova objeto cravado: estabilize-o e procure atendimento. Ferimentos profundos, sujos, em rosto ou com sangramento que não para precisam de avaliação profissional."
  ], callout:{type:"tip", text:"Imobilize como encontrou. Nunca tente \"colocar o osso no lugar\"."}}
 ],
 examples:[
  {title:"Pancada de cabeça no jogo", env:"quadra", text:"Dois jogadores batem a cabeça. Um deles diz estar bem, mas começa a ficar sonolento e vomita. Você leva isso a sério: avisa o professor, liga para o 192 e pede que ele fique parado, sem comer ou beber nada. Você informa que houve batida na cabeça, sonolência e vômitos, sinais de gravidade."},
  {title:"Queda de skate no parque", env:"parque", text:"Um colega cai do skate e relata dor no tornozelo, que incha rápido. Você pede que não apoie o pé e o ajuda a sentar. Com um casaco enrolado e uma tira de tecido, imobiliza na posição encontrada e coloca gelo embrulhado em pano. Chama um adulto e procura atendimento, sem tentar alinhar o pé."}

var mod6 = {
 id:"m6", n:6, title:"Hemorragias", icon:"drop",
 intro:"Um corte, um nariz que sangra, uma queda no cascalho. Sangramento assusta, mas na maioria das vezes pode ser controlado com algo simples: um pano limpo e pressão. Saber agir rápido pode salvar uma vida.",
 objectives:["Definir hemorragia e diferenciar externa e interna","Reconhecer os tipos de sangramento","Identificar sinais e situações de risco","Aplicar os princípios gerais de controle de sangramento","Saber agir em sangramento nasal"],
 sections:[
  {id:"m6s1", title:"O que é hemorragia", body:[
   "Hemorragia é a saída de sangue dos vasos sanguíneos, em quantidade maior do que o corpo consegue repor. O sangue carrega oxigênio para todo o corpo. Quando se perde muito, o corpo não consegue manter a circulação e a pessoa pode entrar em estado de choque. Por isso, o controle precoce é prioridade.",
   "Nem todo sangramento é grave. Um arranhão sangra pouco e para sozinho. Mas um corte profundo ou lesão em vaso importante pode causar perda grande de sangue em poucos minutos. O que importa é a quantidade, a velocidade e a localização do sangramento, além do estado geral da vítima."
  ]},
  {id:"m6s2", title:"Hemorragia externa e interna", body:[
   "Na hemorragia externa, o sangue sai pelo corpo e você consegue ver: cortes, escoriações, fraturas expostas. É a mais fácil de reconhecer e controlar. Já na hemorragia interna, o sangue se acumula dentro do corpo e não aparece, como em uma pancada forte no abdômen ou em fraturas grandes.",
   "A hemorragia interna é perigosa porque passa despercebida. Suspeite quando houver trauma importante, dor forte, abdômen endurecido ou inchado, hematomas extensos, palidez, tontura e sinais de choque. Também pode haver sangue saindo pela boca, ouvido ou nariz. Nesses casos, ligue 192, mantenha a vítima deitada e não dê comida ou bebida."
  ], callout:{type:"warn", text:"Suspeita de hemorragia interna: 192, repouso e nada pela boca."}},
  {id:"m6s3", title:"Tipos de sangramento", body:[
   "Conforme o vaso lesado, o sangramento tem características diferentes. O capilar é o mais comum, em pequenos cortes: o sangue escorre devagar e costuma parar sozinho. O venoso é mais escuro e sai de forma contínua, como um fluxo. O arterial é vermelho vivo e sai em jatos, acompanhando os batimentos do coração.",
   "Na prática, você não precisa classificar com exatidão. O que importa é a gravidade: sangramento que jorra, encharca o pano rapidamente ou não para exige pressão imediata e ligação para o 192. Sangramento em jato é uma emergência. Quanto mais rápido o controle, menor a perda e maior a chance de recuperação."
  ], bullets:["Capilar: pequeno, escorre e para sozinho","Venoso: escuro e contínuo","Arterial: vermelho vivo e em jatos; emergência"]},
  {id:"m6s4", title:"Sinais de risco e estado de choque", body:[
   "Sinais de que a perda de sangue está grave: pele pálida, fria e suada, pulso rápido e fraco, respiração rápida, sede, tontura, sonolência, ansiedade e, depois, confusão. Esse conjunto é o estado de choque. Ele pode surgir em hemorragias externas grandes e internas. Ligue para o 192 imediatamente.",
   "Enquanto o socorro não chega, controle o sangramento visível, deite a vítima e, se não houver trauma de cabeça, coluna ou pernas nem dificuldade para respirar, eleve as pernas. Aqueça a pessoa com um casaco ou cobertor e não dê nada por via oral. Fale com calma e observe a respiração até a chegada da equipe."
  ]},
  {id:"m6s5", title:"Como controlar: princípios gerais e sangramento nasal", body:[
   "Princípios gerais: use luvas ou uma barreira, como sacola plástica, se possível. Aplique pressão direta firme com pano limpo diretamente sobre o ferimento e mantenha. Se o pano encharcar, não o retire: coloque mais panos por cima e continue pressionando. Não remova objeto cravado. Em ferida grave de braço ou perna que não para, o torniquete é último recurso, idealmente por quem foi treinado.",
   "No sangramento nasal (epistaxe), sente a pessoa, incline a cabeça levemente para frente, não para trás, e aperte as narinas por cerca de 10 minutos sem soltar para espiar. Respire pela boca. Se o sangramento não parar, ocorrer após pancada na cabeça ou a pessoa passar mal, ligue para o 192."
  ], callout:{type:"tip", text:"Pano limpo, pressão direta e firme. Se encharcar, ponha mais por cima."}}
 ],
 examples:[
  {title:"Corte na aula de educação física", env:"escola", text:"Um colega se corta no vidro de uma janela e o sangue escorre sem parar. Você pega um pano limpo, pressiona firmemente sobre o corte e pede para alguém chamar o professor. O pano encharca, então você coloca outro por cima, sem retirar o primeiro. Você mantém a pressão até a chegada da ajuda e liga para o 192 se o sangramento não cessar."},
  {title:"Nariz sangrando no acampamento", env:"campo", text:"Uma colega começa a sangrar pelo nariz durante o jogo. Você a ajuda a sentar, inclina a cabeça dela levemente para frente e pede para apertar as narinas por cerca de 10 minutos, respirando pela boca. O sangramento para. Se tivesse continuado ou houvesse pancada na cabeça, você teria ligado para o 192."}
 ],
 summary:["Hemorragia é perda de sangue dos vasos em grande quantidade","Externa é visível; interna fica escondida e é perigosa","Sangramento arterial é vermelho vivo e em jatos: emergência","Pressão direta com pano limpo; se encharcar, colocar mais por cima","Não remover objeto cravado; torniquete só como último recurso e de preferência por quem treinou","Nariz: sentar, inclinar para frente e apertar as narinas por cerca de 10 minutos"],

  {title:"Mito x Verdade", text:"Mito: jogar a cabeça para trás para parar sangramento nasal. Verdade: inclinar para frente evita engolir sangue e engasgo."},

  {id:"m6a2", type:"tf", q:"No sangramento nasal, deve-se inclinar a cabeça para trás.", answer:false, exp:"A cabeça vai levemente para frente, para evitar engolir sangue e engasgar."},

  {id:"m6a4", type:"match", q:"Relacione o tipo de sangramento à característica.", pairs:[["Capilar","Escorre devagar e costuma parar sozinho"],["Venoso","Escuro e contínuo"],["Arterial","Vermelho vivo e em jatos"],["Interno","Não aparece, sinais de choque"]], exp:"Reconhecer ajuda a avaliar a gravidade, mas a conduta é sempre controlar e chamar ajuda se grave."},
  {id:"m6a5", type:"seq", q:"Ordene o controle de um sangramento externo.", items:["Garantir a segurança da cena","Usar luvas ou barreira","Pressionar com pano limpo diretamente na ferida","Colocar mais panos se encharcar","Ligar 192 se grave e manter a vítima deitada"], exp:"Pressão direta é a medida central. Chamar ajuda cedo faz diferença."},
  {id:"m6a6", type:"essay", q:"Descreva os sinais de estado de choque por perda de sangue e o que fazer enquanto o socorro não chega.", exp:"Esperado: pele pálida, fria e suada, pulso rápido e fraco, respiração rápida, sonolência e ansiedade. Conduta: 192, controlar sangramento, deitar, elevar pernas (se sem trauma de cabeça, coluna, pernas ou dificuldade respiratória), aquecer, nada por via oral."}

  {id:"m6s2", type:"mc", q:"Qual é a conduta geral inicial para controlar um sangramento externo?", options:["Aplicar pasta de dente","Pressão direta com pano limpo","Lavar com álcool e esfregar","Aplicar torniquete sempre"], answer:1, exp:"Pressão direta é a medida mais simples e eficaz. O torniquete é só último recurso."},

var m7 = {
 id:"m7", n:7, title:"Parada cardiorrespiratória e RCP", icon:"heartpulse",
 intro:"Na parada cardiorrespiratória, o coração para de bombear sangue e a pessoa desmaia sem respirar normalmente. Cada minuto sem ajuda diminui as chances de sobrevivência. Você não precisa ser médico para fazer diferença: com as mãos, a voz e um celular, você pode manter alguém vivo até a equipe chegar.",
 objectives:["Definir parada cardiorrespiratória e explicar por que ela é uma emergência extrema","Reconhecer uma vítima que não responde e não respira normalmente","Acionar o SAMU (192) e pedir um DEA com rapidez","Descrever o ritmo, o local e a profundidade das compressões torácicas","Explicar os passos básicos de uso do DEA e os cuidados após o atendimento"],
 sections:[
  {id:"m7s1", title:"O que é uma parada cardiorrespiratória", body:[
   "A parada cardiorrespiratória (PCR) acontece quando o coração deixa de bater de forma eficaz e a respiração para ou fica anormal. Sem o coração bombear, o sangue não leva oxigênio ao corpo. O cérebro é o mais sensível: em poucos minutos sem oxigênio, ele começa a sofrer danos que podem ser permanentes.",
   "Por isso a PCR é uma das emergências mais graves que existem. A pessoa fica inconsciente, não responde e não respira, ou apenas faz movimentos estranhos de 'suspiro'. Ela pode acontecer em qualquer idade, por problemas do coração, afogamento, engasgo, choque elétrico, overdose ou trauma grave. Não é preciso saber a causa para começar a ajudar."
  ], callout:{type:"info", text:"Parada cardíaca e infarto não são a mesma coisa. No infarto a pessoa está consciente e com dor; na parada ela está desacordada e sem respirar normalmente."}},
  {id:"m7s2", title:"Como reconhecer e acionar ajuda", body:[
   "O reconhecimento é rápido. Primeiro, garanta que o local é seguro. Depois, toque nos ombros da pessoa, chame em voz alta e observe o peito por até 10 segundos. Se ela não responde e não respira, ou respira de um jeito estranho, como se estivesse 'puxando ar' em arfadas lentas, trate como parada cardíaca.",
   "Em seguida, peça ajuda. Grite por alguém e aponte uma pessoa: 'Você, ligue 192 agora!' e 'Você, traga o DEA!'. Dar tarefas diretas evita que todos fiquem esperando que outro faça. Se estiver sozinho com o celular, ligue para o 192, coloque no viva-voz e comece as compressões enquanto o atendente orienta você.",
   "Nunca perca tempo procurando pulso. Para o leigo, o pulso é difícil de sentir e a dúvida atrasa o socorro. Se a pessoa está desacordada e sem respiração normal, comece."
  ]},
  {id:"m7s3", title:"A Corrente da Sobrevivência", body:[
   "A Corrente da Sobrevivência é uma imagem usada para mostrar que a vida da vítima depende de elos ligados em sequência. Os elos são: reconhecer a parada e chamar ajuda, iniciar a RCP logo, usar o desfibrilador (DEA) o mais cedo possível, receber atendimento avançado da equipe de emergência e ter cuidados após a parada, no hospital.",
   "Os três primeiros elos podem ser feitos por qualquer pessoa presente. Se um elo falha, a corrente enfraquece: sem alguém para ligar 192, a ambulância demora; sem compressões, o cérebro fica sem oxigênio enquanto espera. Quanto mais rápido cada elo acontece, maiores as chances de recuperação. Você pode ser o primeiro elo."
  ]},
  {id:"m7s4", title:"RCP: como fazer as compressões", body:[
   "RCP é a ressuscitação cardiopulmonar. Para o leigo não treinado, o recomendado é a RCP só com as mãos: compressões fortes e rápidas. Deite a vítima de costas em superfície firme. Posicione as mãos, uma sobre a outra, no centro do peito. Mantenha os braços esticados e use o peso do tronco, não só a força dos braços.",
   "O ritmo é de 100 a 120 compressões por minuto, parecido com o de algumas músicas animadas. A profundidade em adultos é de cerca de 5 cm, sem passar de 6 cm. Deixe o peito voltar totalmente após cada compressão e evite pausas longas. Em crianças, afunde cerca de 1/3 do tórax; em bebês, use 2 dedos, cerca de 4 cm.",
   "Quem tem treinamento pode alternar 30 compressões com 2 ventilações. Se você não foi treinado, ou não se sente seguro, faça só compressões. Continue até o DEA mandar parar, a vítima reagir, a equipe assumir ou você não aguentar mais. Revezar a cada 2 minutos ajuda, se houver mais gente."
  ], callout:{type:"tip", text:"Compressões cansam. Se tiver mais pessoas, troque a cada 2 minutos, com a menor pausa possível. Siga o protocolo ensinado pelo instrutor presencial."}},
  {id:"m7s5", title:"DEA e cuidados depois", body:[
   "O DEA (Desfibrilador Externo Automático) é um aparelho que analisa o ritmo do coração e, se necessário, aplica um choque. Ele fala com você passo a passo. Ligue o aparelho, cole as pás no peito nu e seco conforme o desenho, siga as instruções de voz, afaste todos quando ele pedir e, se indicado, aperte o botão de choque.",
   "Logo após o choque, ou se ele disser que não há indicação, retome as compressões imediatamente, até o aparelho avisar novamente. O DEA não machuca quem não precisa de choque: ele só libera se o ritmo exigir. Em crianças, use pás pediátricas se houver; se não houver, o aparelho comum é melhor do que nenhum.",
   "Quando a equipe chegar, conte o que aconteceu, quanto tempo durou e se o DEA foi usado. Depois, é normal sentir tremor, tristeza ou ansiedade. Converse com um adulto de confiança. Você agiu para salvar uma vida, e o resultado não depende só de você."
  ]}
 ],
 examples:[
  {title:"Colapso na quadra", env:"quadra", text:"Durante o treino, um colega de 16 anos cai, não responde e só faz arfadas estranhas. Você verifica que a quadra está segura, chama pelo nome e confirma que ele não responde. Manda alguém ligar 192 e outro buscar o DEA do ginásio. Você começa as compressões no centro do peito. Quando o DEA chega, liga e segue a voz do aparelho. Cada minuto conta, e fazer algo é melhor do que esperar."},
  {title:"Avô no domingo de almoço", env:"casa", text:"Seu avô se levanta da mesa, cai e não responde. Ele não respira normalmente. Você grita por ajuda, uma prima liga para o 192 e você começa as compressões no chão firme, não no sofá. O atendente do 192 fala com ela no viva-voz e ajuda a manter o ritmo. Você continua até a equipe chegar, sem parar para procurar pulso."}
 ],

  {title:"Checklist rápido", text:"Cena segura, chamar, não respira normal, ligar 192, pedir DEA, comprimir forte e rápido, usar o DEA, continuar até a equipe chegar."},

var m8 = {
 id:"m8", n:8, title:"Fraturas", icon:"alert",
 intro:"Uma queda de bicicleta, um tropeço na escada ou um choque na quadra: fraturas são mais comuns do que se imagina. Saber reconhecer e o que fazer (e o que NÃO fazer) evita que um osso quebrado vire uma lesão ainda pior enquanto você espera a ajuda chegar.",
 objectives:["Definir fratura e diferenciar fratura aberta de fechada","Reconhecer sinais e sintomas de uma possível fratura","Aplicar os cuidados iniciais seguros como socorrista leigo","Explicar por que a imobilização feita corretamente protege a vítima","Identificar quando é necessário acionar o 192"],
 sections:[
  {id:"m8s1", title:"O que é uma fratura", body:[
   "Fratura é a quebra ou rachadura de um osso. Ela pode acontecer por queda, pancada, acidente de trânsito, esporte ou torção forte. Crianças e adolescentes têm ossos em crescimento, e podem sofrer fraturas até em tombos que parecem leves, como cair do skate ou se chocar com um colega na quadra.",
   "Nem toda dor depois de uma pancada é fratura, e você não precisa ter certeza para agir. Se há suspeita, trate como fratura até um profissional examinar, normalmente com radiografia. O erro mais comum é pensar: 'se mexe, não quebrou'. Uma pessoa pode mover o membro e mesmo assim ter o osso quebrado."
  ]},
  {id:"m8s2", title:"Fratura fechada e fratura aberta", body:[
   "Na fratura fechada, o osso quebra, mas a pele continua inteira. Pode haver inchaço, roxo e deformidade, porém sem ferida aberta. Já na fratura aberta (ou exposta), a pele se rompe, e o osso pode ou não aparecer. Há sangramento e risco de infecção, porque os microrganismos têm acesso direto ao local da lesão.",
   "Uma fratura fechada pode ser tão grave quanto uma aberta, porque os ossos grandes, como o fêmur, podem causar muita perda de sangue por dentro. Por isso, não julgue a gravidade só pela aparência. Observe sinais gerais: palidez, suor frio, dor muito forte e dificuldade de respirar indicam necessidade de ajuda imediata."
  ]},
  {id:"m8s3", title:"Sinais e sintomas", body:[
   "Os sinais mais comuns são: dor intensa no local, que piora ao mexer, inchaço, hematoma (roxo), deformidade (o membro parece torto ou com formato diferente), incapacidade ou dificuldade de movimentar e, às vezes, ferida com sangramento. A vítima pode relatar que ouviu ou sentiu um 'estalo' no momento do impacto.",
   "Compare com o lado oposto do corpo: se um braço está com formato diferente do outro, é suspeito. Observe também cor e temperatura dos dedos. Dedos muito pálidos, azulados, frios ou com formigamento podem indicar circulação prejudicada, e isso exige ajuda rápida. Converse com a vítima e a tranquilize durante a avaliação."
  ]},
  {id:"m8s4", title:"Cuidados iniciais e imobilização", body:[
   "Primeiro, garanta a segurança da cena e acalme a vítima. Peça que ela não se mexa. Imobilize o membro NA POSIÇÃO em que foi encontrado: não tente alinhar, não empurre o osso de volta e não force movimentos. Use o apoio disponível, como uma tala improvisada com papelão ou revista dobrada, protegendo e imobilizando a articulação acima e a abaixo da lesão.",
   "Se houver ferida, cubra com pano limpo, sem pressionar o osso. Se houver sangramento, faça pressão ao redor, não sobre o osso exposto. Pode aplicar frio no local, com gelo envolto em pano, nunca direto na pele. Não dê comida nem bebida, pois a vítima pode precisar de cirurgia. Acione o 192 em casos graves.",
   "A imobilização correta reduz a dor, evita que as pontas do osso machuquem músculos, vasos e nervos e diminui o sangramento interno. Uma imobilização mal feita, apertada demais ou com movimentos bruscos pode agravar a lesão. Se não tiver certeza, mantenha a vítima parada e espere a equipe. Siga o protocolo ensinado pelo instrutor presencial."
  ], callout:{type:"warn", text:"Nunca tente 'colocar o osso no lugar'. Isso pode lesionar nervos e vasos e causar infecção."}},
  {id:"m8s5", title:"Quando chamar o 192", body:[
   "Ligue 192 se houver fratura aberta, suspeita de fratura de coluna, pescoço, crânio, bacia ou fêmur, deformidade importante, dedos pálidos ou azulados, sinais de choque (palidez, suor frio, sonolência), dificuldade de respirar ou acidente de alta energia, como queda de grande altura ou atropelamento.",
   "Diante de dúvida, é melhor ligar. Se há suspeita de lesão na cabeça, pescoço ou coluna, não movimente a vítima e mantenha-a calma e imóvel, a não ser que haja perigo imediato como fogo ou desabamento. Em casos mais leves, como suspeita de fratura de dedo, a vítima deve ser levada a atendimento médico por um adulto responsável."
  ]}
 ],
 examples:[
  {title:"Queda na escada da escola", env:"escola", text:"Uma colega escorrega na escada e segura o antebraço, gritando de dor. O braço parece torto e está inchando. Você pede que ela fique parada, avisa um adulto e imobiliza o braço na posição em que está, apoiando com uma revista dobrada e uma echarpe, sem tentar endireitar. Aplica gelo envolto em pano e acompanha até o atendimento. Não dá nada para ela comer ou beber."},
  {title:"Tombo de bicicleta", env:"rua", text:"Um amigo cai da bike e o osso da perna aparece pela pele. Você liga 192, cobre a ferida com um pano limpo, sem empurrar o osso, e mantém a perna parada. Não tenta levantar o amigo nem alinhar a perna. Fala com ele com calma até o resgate chegar. A fratura aberta pode infectar e sangrar muito, por isso a ajuda profissional é essencial."}
 ],
 summary:["Fratura é a quebra de um osso, aberta (pele rompida) ou fechada.","Sinais: dor, inchaço, roxo, deformidade e dificuldade de mover.","Imobilize na posição encontrada; não alinhe nem empurre o osso.","Cubra fratura exposta com pano limpo e controle o sangramento ao redor.","Frio com pano entre o gelo e a pele; nada de comida ou bebida.","Ligue 192 em casos graves, e na dúvida, ligue."],
 extras:[
  {title:"Mito x Verdade", text:"Mito: 'Se a pessoa consegue mexer, não está quebrado.' Verdade: algumas fraturas permitem algum movimento. Só o exame médico confirma."},
  {title:"Curiosidade", text:"Os ossos de crianças e adolescentes ainda estão crescendo, e podem 'rachar' em vez de quebrar por completo. Mesmo assim, precisam de avaliação médica."},
  {title:"Checklist rápido", text:"Cena segura, acalmar, não mexer, imobilizar como está, cobrir ferida, frio com pano, 192 se grave, não dar nada para comer ou beber."}
 ],
 cards:[

 ],

  {id:"m8a3", type:"short", q:"O que você deve usar para proteger a pele quando aplica gelo no local lesionado?", answers:["pano","tecido","toalha","compressa"], exp:"O gelo vai envolto em um pano para evitar queimadura por frio na pele."},
  {id:"m8a4", type:"match", q:"Relacione o sinal ou situação com a ação.", pairs:[["Osso exposto","Cobrir com pano limpo e ligar 192"],["Membro torto","Imobilizar na posição encontrada"],["Dedos azulados","Sinal de circulação prejudicada, chamar ajuda"],["Dor e inchaço","Aplicar frio com pano entre o gelo e a pele"]], exp:"Cada sinal pede uma conduta simples e segura, sempre sem tentar realinhar o osso."},
  {id:"m8a5", type:"seq", q:"Ordene os cuidados iniciais com uma suspeita de fratura no braço.", items:["Garantir a segurança da cena","Pedir que a vítima não se mexa","Imobilizar o braço como foi encontrado","Aplicar frio com pano","Procurar atendimento médico"], exp:"Primeiro a segurança, depois a calma e a imobilização. O frio ajuda no conforto e o atendimento médico confirma a lesão."},
  {id:"m8a6", type:"essay", q:"Explique por que não se deve tentar alinhar ou empurrar o osso de volta.", exp:"Esperado: o movimento pode lesionar nervos, vasos e músculos, aumentar sangramento, dor e risco de infecção; a conduta correta é imobilizar na posição encontrada e esperar profissionais."}
 ],
